<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mcpmem — principals</title>
  <link rel="stylesheet" href="/ui/nav.css">
  <link rel="stylesheet" href="/ui/admin.css">
</head>
<body>
  <nav id="sitenav" aria-label="Sections">
    <a class="nav-brand" href="/ui">mcp&#8209;memory</a>
    <a href="/ui">Graph</a>
    <a href="/ui/admin" aria-current="page">Administration</a>
  </nav>
  <div id="page">
    <header>
      <h1>Principals</h1>
      <p class="hint" id="status"></p>
    </header>
    <main>
      <section id="principals">
        <h2>Who may authorize</h2>
        <button id="add" hidden>Add principal</button>
        <table>
          <thead><tr><th>Name</th><th>Identity</th><th>Scopes</th><th></th></tr></thead>
          <tbody id="principal-rows"></tbody>
        </table>
      </section>
      <section id="waitlist">
        <h2>Pending approvals</h2>
        <table>
          <thead><tr><th>Name</th><th>Identity</th><th>First seen</th><th></th></tr></thead>
          <tbody id="waitlist-rows"></tbody>
        </table>
      </section>
      <section id="webhooks" hidden>
        <h2>Webhook subscriptions</h2>
        <p class="hint" id="webhook-status"></p>
        <button id="add-webhook" hidden>Add subscription</button>
        <table>
          <thead><tr><th>Endpoint</th><th>Origin</th><th>Filters</th><th>Secret</th><th>State</th><th></th></tr></thead>
          <tbody id="webhook-rows"></tbody>
        </table>
      </section>
      <section id="repos" hidden>
        <h2>Code repositories</h2>
        <p class="hint" id="repo-status"></p>
        <button id="add-repo" hidden>Add repository</button>
        <table>
          <thead><tr><th>Key</th><th>URL</th><th>Auth</th><th>State</th><th>Last indexed</th><th></th></tr></thead>
          <tbody id="repo-rows"></tbody>
        </table>
      </section>
    </main>
  </div>
  <dialog id="form"></dialog>
  <script src="/ui/admin.js"></script>
</body>
</html>
