[workspace]
members = [".", "crates/mcpmem-core", "crates/mcpmem-runtime", "crates/mcpmem-indexer", "crates/mcpmem-webhook", "crates/mcpmem-oauth"]
resolver = "3"

[package]
name = "mcpmem"
version = "1.1.0"
edition = "2024"
authors = ["Artur Bańkowski", "Piyush <original mcp-memory author>"]
description = "MCP server giving LLM agents persistent memory: a SQLite knowledge graph with FTS5 search, tree-sitter code indexing (11 languages) with semantic code search, and optional vector + hybrid search (usearch HNSW or IVF-Flat) with batch upsert, more-like-this, recommendations, and MMR diversification"
license = "Apache-2.0"
repository = "https://github.com/abankowski/mcpmem"
readme = "README.md"
keywords = ["mcp", "knowledge-graph", "memory", "llm", "agent"]
categories = ["command-line-utilities"]
exclude = ["/target", "*.mcpmem"]

[dependencies]
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"
rustc-hash = "2.1"
axum = "0.8"
# Server-side TLS (HTTPS) for the axum HTTP transport. `tls-rustls-no-provider`
# keeps rustls on the process default `ring` crypto provider (installed in
# src/tls.rs) — no cmake/aws-lc toolchain required.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Response compression for the HTTP transport (graph JSON + embedded UI assets).
# The default predicate skips SSE, so the `/mcp` streams stay uncompressed.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "compression-br"] }
futures = "0.3"
subtle = "2.6"
lru = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
dashmap = "6"
petgraph = "0.7"
usearch = "2"
zerocopy = { version = "0.8", features = ["derive"] }
mcpmem-core = { path = "crates/mcpmem-core", version = "1.1.0" }
mcpmem-runtime = { path = "crates/mcpmem-runtime", version = "1.1.0" }
mcpmem-indexer = { path = "crates/mcpmem-indexer", version = "1.1.0", optional = true }
mcpmem-webhook = { path = "crates/mcpmem-webhook", version = "1.1.0", optional = true }
mcpmem-oauth = { path = "crates/mcpmem-oauth", version = "1.1.0" }
uuid = { version = "1" }
# Percent-encoding, for the two places the OAuth routes meet a query string:
# parsing the consent form body (which repeats `scope`, so no `Deserialize`
# shape fits it) and building the redirect back to the client. It arrives with
# the `oauth` feature and with nothing else — a graph-only build has no
# authorization endpoint to encode for. `url` carries no HTTP client, so the
# `.github/workflows/ci.yml` guard on that build is unaffected.
url = { version = "2", optional = true }
# The `--config` file parser. Parsing and `serde` only: the server reads a
# configuration file and never writes one, so the serializer stays out of the
# build. `toml` carries no HTTP client, so the graph-only dependency guard in
# `.github/workflows/ci.yml` is unaffected.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# --- Code-symbol indexing (feature = "code") ---------------------------------
# Tree-sitter parsing + the `tags` extractor drive the code knowledge graph.
# All optional and gated behind the default-on `code` feature so
# `--no-default-features` yields a lean pure-memory build with no C grammars.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-tags = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }

ignore = { version = "0.4", optional = true }
blake3 = { version = "1", optional = true }
notify = { version = "8", optional = true }

[features]
default = ["code", "oauth"]
indexer = ["mcpmem-runtime/indexer", "dep:mcpmem-indexer"]
webhooks = ["mcpmem-runtime/webhooks", "dep:mcpmem-webhook"]
bedrock = ["indexer", "mcpmem-indexer/bedrock"]
# The upstream OpenID Connect leg: `GET /oauth/authorize` and
# `GET /oauth/callback`. Forwarding rather than a `features = ["upstream"]` on
# the dependency line is what keeps the guard at `.github/workflows/ci.yml`
# green: a forwarded feature is dropped by `--no-default-features`, and the
# HTTP client goes with it. A graph-only build serves no OAuth login, which is
# the intended meaning.
oauth = ["mcpmem-oauth/upstream", "dep:url"]
# Tree-sitter code-symbol indexing: the `code_*` MCP tools + indexer.
code = [
    "dep:tree-sitter",
    "dep:tree-sitter-tags",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
    "dep:tree-sitter-scala",
    "dep:ignore",
    "dep:blake3",
    "dep:notify",
]

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.41", features = ["process"] }
mcpmem-webhook = { path = "crates/mcpmem-webhook", version = "1.1.0" }
# Drive the axum router in-process (`oneshot`) and collect a response body,
# so the HTTP tests need no socket and no HTTP client.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The fake OpenID Connect provider in `tests/support/fake_idp.rs` signs its own
# identity tokens: `ring` generates the P-256 keypair, `jsonwebtoken` signs with
# it, and `base64` encodes the two public coordinates into the JWKS. `reqwest`
# is the client that drives the provider's own endpoints; it is already in the
# tree through the `oauth` feature, so it costs nothing here.
#
# `url` percent-encodes and parses in `tests/support/flow.rs`. It is a plain
# dev-dependency rather than the optional one the `oauth` feature pulls in,
# because the fixture compiles for every feature set and a `--no-default-features`
# test build must still have it.
jsonwebtoken = { version = "9", default-features = false }
ring = "0.17"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
url = "2"

[[bin]]
name = "mcpmem"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "mcpmem-maintenance"
path = "src/bin/maintenance.rs"

# Tests validate statistical distortion bounds with numeric hot loops
# (Hadamard rotations, D×D matvecs, Lloyd-Max iterations); at opt-level 0
# they are 10-50x slower. Level 1 keeps compiles fast and code debuggable.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.clippy]
large_stack_frames = "warn"
large_enum_variant = "warn"
boxed_local = "warn"
box_collection = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_to_owned = "warn"
implicit_clone = "warn"
iter_overeager_cloned = "warn"
ptr_arg = "warn"
missing_const_for_fn = "warn"
cast_lossless = "warn"
unnecessary_cast = "warn"
vec_init_then_push = "warn"
string_add_assign = "warn"
inefficient_to_string = "warn"
manual_memcpy = "warn"
useless_vec = "warn"
slow_vector_initialization = "warn"
manual_find_map = "warn"
manual_filter_map = "warn"
mutex_atomic = "warn"
option_option = "warn"

[lints]
workspace = true
