name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes this run. Without this, every push
# waits behind the run it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The only file set a release bump touches is the version manifests
  # (Cargo.toml, Cargo.lock, crates/*/Cargo.toml; see scripts/set-version.sh).
  # For a bump, the compile-and-test matrix proves nothing new: the code is
  # unchanged, so a 6-minute wait per leg buys no signal (2026-10-07,
  # chore/open-3.0.6: the bump PR queued the whole matrix for nothing).
  # This job runs for every change, owns the version contract checks, and
  # tells every heavy job below whether the diff is a pure version bump.
  version:
    runs-on: ubuntu-latest
    outputs:
      bump-only: ${{ steps.detect.outputs.bump-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # An invalid workflow file otherwise fails as a run with no logs, which
      # names no cause. This step names it. It lives here so it runs for
      # every change, including a bump-only one.
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Workspace versions agree and are valid semver
        run: scripts/check-release-version.sh
      # The version in the code must not already carry a release tag: a tag
      # means that version was released, and work merged on top of it would
      # silently extend a shipped version. The release workflow bumps the
      # version on a dedicated PR right after publishing, so any other PR
      # against main is expected to sit on a version with no tag yet. The
      # name is read from the root manifest so this stays in sync with the
      # rest of the version tooling. For a version bump this single gate is
      # the only check that matters: it proves the new version is not taken.
      - name: The version in the code has no release tag yet
        if: github.event_name == 'pull_request'
        run: |
          version="$(awk '/^\[package\]/ {inpkg = 1; next}
                     /^\[/ {inpkg = 0}
                     inpkg && /^version = / {gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q "refs/tags/v${version}"; then
            echo "::error::version ${version} already has a release tag v${version}; this version was shipped. Advance the version before merging work onto it (see scripts/next-version.sh)"
            exit 1
          fi
          echo "version ${version} has no release tag yet"
      - name: Detect a pure version bump
        id: detect
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                echo "bump-only=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              base="${{ github.event.before }}"
              ;;
            *)
              echo "bump-only=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed="$(git diff --name-only "${base}..HEAD" | sort -u)"
          before="$(git show "${base}:Cargo.toml" | awk '/^\[package\]/ {p = 1; next} /^\[/ {p = 0} p && /^version = / {gsub(/[",]/, "", $3); print $3; exit}')"
          after="$(awk '/^\[package\]/ {p = 1; next} /^\[/ {p = 0} p && /^version = / {gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)"
          non_manifest="$(printf '%s\n' "${changed}" | grep -vx 'Cargo.toml\|Cargo.lock\|crates/.*/Cargo\.toml' || true)"
          # A pure bump: the root package version moved and no file outside
          # the version manifests changed. A dependency edit touches the same
          # files, so the version-line comparison is what separates it out.
          if [ -n "${before}" ] && [ "${before}" != "${after}" ] && [ -z "${non_manifest}" ]; then
            echo "::notice::only the version manifests changed; heavy checks are skipped (release version bump)"
            echo "bump-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "bump-only=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: [frontend, version]
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The root crate embeds the built bundle at compile time
      # (include_str!/include_bytes! through src/ui/assets.rs), so every
      # cargo leg needs the ui/dist the frontend job just built and checked.
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      # An invalid workflow file otherwise fails as a run with no logs, which
      # names no cause. The `version` job above names it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - name: Install external PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check PDF renderer commands
        run: command -v pdfinfo && command -v pdftoppm && pdfinfo -v && pdftoppm -v
      # The v1.0.0-rc.1 release failed while verifying the packaged crate,
      # because an include_str! read a file outside the crate root. CI now
      # answers that question before a release does.
      - name: Every include stays inside its crate
        run: scripts/check-crate-includes.sh
      - name: The packaged core crate compiles
        run: cargo package -p mcpmem-core --locked
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint every feature combination
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets -- --test-threads=1
      - name: Test indexer worker feature
        run: |
          cargo test --test indexer_worker --features indexer -- --test-threads=1
          cargo test --test indexer_worker --no-default-features --features indexer -- --test-threads=1
      - name: Test attachment extraction and real PDF vision routing
        run: |
          cargo test --test attachment_extraction --features extractor -- --test-threads=1
          cargo test --test attachment_extraction --features extractor pdf_render_routes_page_to_vision -- --exact --test-threads=1
      - name: Test attachment MCP and HTTP interfaces
        run: |
          cargo test --test attachment_mcp --test attachment_http --features extractor -- --test-threads=1
      - name: Test attachment search and inspector
        run: |
          cargo test --test vector_e2e --test semantic_search --test ui_http --features extractor -- --test-threads=1
      # The taxonomy unit tests are gated on the `indexer` feature, so the
      # default workspace run never builds them and the `--test indexer_worker`
      # leg does not run them. This leg executes them directly.
      - name: Test lib with the indexer feature
        run: cargo test --lib --features indexer -- --test-threads=1
      - name: Test runtime role feature matrix
        run: |
          cargo test --test role_composition --no-default-features
          cargo test --test role_composition --features indexer
          cargo test --test role_composition --features webhooks
          cargo test --test role_composition --features extractor
          cargo test --test role_composition --no-default-features --features extractor
          cargo test --test role_composition --features extractor,webhooks
          cargo test --test role_composition --features indexer,webhooks
      - name: Test webhook subscription feature
        run: |
          cargo test --test webhook_tools --test webhook_admin --features webhooks -- --test-threads=1
      - name: Keep graph-only build free of HTTP and AWS clients
        run: |
          if cargo tree --no-default-features -e normal | rg -q '(^| )(reqwest|aws-[a-z0-9-]+|aws_sdk_[a-z0-9_]+) v'; then
            echo 'graph-only build unexpectedly includes an HTTP or AWS client'
            exit 1
          fi

  # The landing page must keep building: its template and content are checked
  # against each other by the build itself, so a pushed but broken page would
  # otherwise surface only on deploy.
  site:
    needs: version
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        working-directory: site
        name: Build the landing page
  # The UI is a checked-in source tree and a git-ignored build output. This
  # job rebuilds the output from the source, checks the manifest contract,
  # and uploads the bundle for every job whose cargo build embeds it.
  frontend:
    needs: version
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 is the floor: the build and check scripts use node:fs
      # globSync, which exists from Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui
      - name: Build the UI bundle and write the manifest
        run: npm run build
        working-directory: ui
      - name: Check the manifest and the types
        run: npm run check
        working-directory: ui
      # The embedded asset table is checked in; a fresh build must not
      # change it. Regenerating and diffing proves the record is current —
      # otherwise every frontend rebuild needs a hand edit and a revert
      # risk, which is what happened before the generator existed.
      - name: Regenerate the embedded asset table
        run: node scripts/generate-assets-table.mjs
      - name: The embedded asset table matches the fresh manifest
        run: git diff --exit-code -- src/ui/assets.rs
      - name: Upload the built bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  # The packaged crate must ship the bundle: a crate without ui/dist cannot
  # compile its embedded manifest, which is how the v1.0.0-rc.1 release
  # failed (an include read a file outside the crate). The full package
  # verification (`cargo package -p mcpmem --locked`) needs the workspace
  # crates already published at this version, so the job runs the dry-run
  # and the package check instead; the check packs the dry-run's own file
  # list and verifies the manifest contract against those bytes.
  ui-package:
    needs: [frontend, version]
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: The packaged crate carries the manifest and every asset
        run: node scripts/check-ui-package.mjs

  # The route matrix from Task 4 under the feature sets the UI module can
  # be compiled with, and the no-default OAuth flow beside it. Each leg
  # names the tests that make sense for its feature set: the oauth legs run
  # the full token flow, the ui legs run the router matrix.
  feature-matrix:
    needs: [frontend, version]
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Route matrix and OAuth flow with default features
        run: cargo test --test ui_router --test oauth_flow --features ui -- --test-threads=1
      - name: Route matrix without default features
        run: cargo test --test ui_router --no-default-features -- --test-threads=1
      - name: Route matrix with the ui feature only
        run: cargo test --test ui_router --no-default-features --features ui -- --test-threads=1
      - name: OAuth flow with the oauth feature only
        run: cargo test --test oauth_flow --no-default-features --features oauth -- --test-threads=1

  # The browser behavior suite: real headless Chromium against a real
  # server binary, with Poppler for the PDF legs and the fixture vision
  # endpoint from ui/e2e. The suite spawns target/debug/mcpmem, so the job
  # builds it with the features ui/e2e/server.toml requires.
  browser:
    needs: [frontend, version]
    if: needs.version.outputs.bump-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 is the floor: the suite and the fixture services use
      # node:fs globSync and node:child_process spawnSync.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - name: Install external PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Build the server binary the suite spawns
        run: cargo build --features indexer,extractor,webhooks
      - name: Run the browser behavior suite
        run: npm run e2e
        working-directory: ui
