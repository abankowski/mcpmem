name: release

# crates.io publishing happens only for a published GitHub release. A push to
# main never publishes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify, for example v1.0.0
        required: true
      dry_run:
        description: Package and verify without publishing
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Verify the tag, workspace versions, main ancestry, and exact CI proof
  # before target work. This job gates the frontend and archive jobs.
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Tag, semver and crates.io agree
        run: scripts/check-release-version.sh --registry "${{ github.event.release.tag_name || inputs.tag }}"
      # The release event may also carry a prerelease mismatch that the same
      # tag string cannot express (v1.0.0-rc.1 without the prerelease box).
      - name: A prerelease version needs a prerelease GitHub release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "${TAG#v}" in
          *-*) semver_prerelease=true ;;
          *) semver_prerelease=false ;;
          esac
          if [ "${semver_prerelease}" != "${IS_PRERELEASE}" ]; then
            echo "::error::tag ${TAG} is prerelease=${semver_prerelease}, GitHub release is prerelease=${IS_PRERELEASE}"
            exit 1
          fi
          echo "tag ${TAG} and the GitHub release agree on prerelease=${IS_PRERELEASE}"
      - name: The tag commit is on main
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${TAG} is not an ancestor of origin/main"
            exit 1
          fi
          echo "tag commit is on main"
      - name: CI passed for the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-ci.sh "$(git rev-parse HEAD)"

  # Build and verify every target archive before any crate publish. The crate
  # embeds ui/dist, so each leg restores the tagged bundle from `frontend`.
  archive:
    needs: [frontend, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install external PDF renderer
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          else
            brew install poppler
          fi
      - name: Check PDF renderer commands on the release target
        run: command -v pdfinfo && command -v pdftoppm && pdfinfo -v && pdftoppm -v
      - name: Test real PDF rendering against fake vision
        run: cargo test --locked --target "${{ matrix.target }}" --test attachment_extraction --features extractor pdf_render_routes_page_to_vision -- --exact --test-threads=1
      - name: Build the release binaries
        run: cargo build --release --all-features --locked --target "${{ matrix.target }}"
      # The Linux x64 binary is the portable release smoke target. Other legs
      # prove their target build and archive before publication.
      - name: Smoke test the bundled UI from the Linux x64 release binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          binary="target/${{ matrix.target }}/release/mcpmem"
          "${binary}" --transport http --bind 127.0.0.1:8091 \
            --auth-token smoke --legacy-owner-id machine:local \
            --memory-file /tmp/mcpmem-smoke.mcpmem &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=""
          attempt=0
          while [ "${ready}" = "" ] && [ "${attempt}" -lt 60 ]; do
            attempt=$((attempt + 1))
            if curl -fsS -o /dev/null http://127.0.0.1:8091/ui 2>/dev/null; then
              ready=1
            else
              sleep 1
            fi
          done
          if [ -z "${ready}" ]; then
            echo "smoke failed: the server did not answer /ui within 60 s"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8091/ui | grep -q '<div id="root">'
          asset="$(jq -r '.files | keys[0]' ui/dist/ui-manifest.json)"
          want="$(jq -r --arg a "$asset" '.files[$a].sha256' ui/dist/ui-manifest.json)"
          ctype="$(jq -r --arg a "$asset" '.files[$a].contentType' ui/dist/ui-manifest.json)"
          curl -fsS -D - -o /dev/null "http://127.0.0.1:8091${asset}" | grep -qi "content-type: ${ctype}"
          curl -fsS "http://127.0.0.1:8091${asset}" -o /tmp/mcpmem-smoke-asset
          test "$(sha256sum /tmp/mcpmem-smoke-asset | cut -d' ' -f1)" = "${want}"
          echo 'smoke passed: the release binary serves the bundled UI without Node'
      - name: Archive the release binaries
        id: archive
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          archive="mcpmem-${TAG}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "${archive}" mcpmem mcpmem-maintenance bench
          printf 'path=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
      - name: Store the target archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.target }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
  # The embedded UI bundle is a git-ignored build output: every release
  # artifact must be built from the tagged ui/src by this job first, and the
  # jobs that compile or package the crate restore it into ui/dist.
  frontend:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # Node 22 is the floor: the build and check scripts use node:fs globSync.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui
      - name: Build the UI bundle and write the manifest
        run: npm run build
        working-directory: ui
      - name: Check the manifest and the types
        run: npm run check
        working-directory: ui
      - name: Regenerate the embedded asset table
        run: node scripts/generate-assets-table.mjs
      - name: The embedded asset table matches the fresh manifest
        run: git diff --exit-code -- src/ui/assets.rs
      - name: Upload the built bundle
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  # The archive job already checks every target artifact. This job restores
  # ui-dist for package contents, then publishes without another build or test.
  publish:
    needs: [archive]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # Trusted Publishing exchanges this OIDC token for a 30-minute crates.io
      # token. The action revokes it when the job ends.
      id-token: write
      contents: read
    env:
      # The `secrets` context is not available in a step `if`, but it is
      # available here. The value is a string, "true" or "false".
      HAS_STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Restore the built UI bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
      # Preferred path: no stored credential. It needs a Trusted Publisher
      # entry on crates.io for every crate, which crates.io accepts only after
      # the crate exists. The first release therefore uses the secret, and the
      # secret can be deleted afterwards.
      - name: Get a short-lived crates.io token
        id: auth
        if: env.HAS_STORED_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "::error::no crates.io credential: add the CARGO_REGISTRY_TOKEN secret, or configure Trusted Publishing for all seven crates"
            exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            scripts/publish-crates.sh --dry-run
          else
            scripts/publish-crates.sh
          fi

  # The archive matrix stores all target files before crates.io accepts the
  # packages. Attach those stored files only after publishing succeeds.
  upload-binaries:
    needs: [publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Restore target archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-archive-*
          path: release-assets
          merge-multiple: true
      - name: Upload release archives
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" release-assets/*.tar.gz --clobber

  # After a release, `main` names the version that is coming next, never the one
  # already published. Owner decision, 2026-09-10, after two releases failed
  # because a tag moved and the manifests did not.
  #
  # The bump lands as a pull request, not a direct push. `main` accepts nothing
  # but pull requests (owner decision, 2026-09-11, after the oauth publish fix
  # was rejected by the repository rules), and a workflow pushing past its own
  # rule would fail loudly anyway.
  bump:
    # publish alone gates the bump. The upload job is a distribution nicety;
    # letting it fail skip the bump left main naming v1.0.3 while crates.io
    # already held 1.0.3, and every later release repeated the publish (v1.0.3,
    # 2026-09-12). The bump runs in parallel with the upload job instead.
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Open the version bump as a pull request
        env:
          RELEASED: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          released="${RELEASED#v}"
          current="$(awk '/^\[package\]/ {p=1; next} /^\[/ {p=0} p && /^version = / {gsub(/[",]/, "", $3); print $3; exit}' Cargo.toml)"
          if [ "${current}" != "${released}" ]; then
            echo "::notice::main is at ${current}, not the released ${released}; somebody advanced it already, nothing to do"
            exit 0
          fi
          next="$(scripts/next-version.sh "${released}")"
          scripts/set-version.sh "${next}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch="chore/open-${next}"
          git checkout -b "${branch}"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "chore: open ${next} after releasing ${released}"
          git push -u origin "${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Open ${next} after releasing ${released}" \
            --body "The release tagged \`${released}\` is complete. This moves \`main\` to \`${next}\` so the next release starts from a fresh version."
          # Land the bump without a human. main must always name the coming
          # version; a bump that waits "whenever convenient" leaves main on a
          # released version and every later PR fails the version gate
          # (chore/open-3.0.3 sat unmerged, 2026-10-06, and blocked rust on
          # every PR). --rebase matches the repository's merge method.
          # A fresh bump PR has no check runs yet, so GitHub already reports
          # it clean; enabling auto-merge on a clean PR is refused ("Pull
          # request is in clean status") and gh turns that refusal into a run
          # failure (v3.0.5, 2026-10-07: PR #77 created, bump job failed).
          # Merge immediately when clean; otherwise arm auto-merge and let it
          # land once the checks settle.
          merge_state="$(gh pr view "${branch}" --json mergeStateStatus --jq .mergeStateStatus)"
          if [ "${merge_state}" = "CLEAN" ]; then
            gh pr merge "${branch}" --rebase
          else
            gh pr merge "${branch}" --auto --rebase
          fi
