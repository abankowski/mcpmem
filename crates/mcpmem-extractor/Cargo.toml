[package]
name = "mcpmem-extractor"
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Durable attachment extraction worker for the mcpmem MCP server: UTF-8 text decoding and Poppler-rendered PDF OCR through a vision endpoint."
repository = "https://github.com/abankowski/mcpmem"
readme = "README.md"

[dependencies]
base64 = "0.22"
libc = "0.2"
mcpmem-core = { path = "../mcpmem-core", version = "3.0.0" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
url = "2"

[lints]
workspace = true