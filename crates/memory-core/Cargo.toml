[package]
name = "memory-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }

[lints]
workspace = true
