[package]
name = "webhook-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
hmac = "0.12"
memory-core = { path = "../memory-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"
url = "2"

[lints]
workspace = true
