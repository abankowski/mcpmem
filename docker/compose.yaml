services:
  mcpmem:
    image: "${MCPMEM_IMAGE:?Set MCPMEM_IMAGE to an image tag.}"
    ports:
      - "8443:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - mcpmem-data:/var/lib/mcpmem
      - ./config/mcpmem.toml:/etc/mcpmem/mcpmem.toml:ro
      - ./tls/tls.crt:/etc/mcpmem/tls/tls.crt:ro
      - ./tls/tls.key:/etc/mcpmem/tls/tls.key:ro
    # File-backed secrets keep the source owner and mode.
    # Set the source owner to 10001:10001 before `docker compose up`.
    # Set the source mode to 0400 before `docker compose up`.
    secrets:
      - source: mcpmem-auth-token
        target: mcpmem-auth-token

volumes:
  mcpmem-data:

secrets:
  mcpmem-auth-token:
    file: ./secrets/mcpmem-auth-token
